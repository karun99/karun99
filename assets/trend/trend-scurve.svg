<svg xmlns="http://www.w3.org/2000/svg" width="960" height="486" viewBox="0 0 960 486" role="img" aria-label="Research trend lifecycle S-curve with commit and pivot zones">
  <title>Research trend lifecycle S-curve with commit and pivot zones</title>
  <rect width="960" height="486" rx="16" fill="#151824"/>
  <text x="32" y="42" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#e6e9f2" text-anchor="start" opacity="1">Research Trend Lifecycle</text>
  <text x="32" y="66" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#98a2c0" text-anchor="start" opacity="1">Where a direction sits on the adoption S-curve decides whether to start, guard, or stop.</text>
  <rect x="78" y="92" width="222" height="244" fill="#2b3149" opacity="0.55"/>
  <text x="189.0" y="112" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#98a2c0" text-anchor="middle" opacity="1">EMERGENCE</text>
  <rect x="300" y="92" width="266" height="244" fill="#1d3a2a" opacity="0.55"/>
  <text x="433.0" y="112" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#98a2c0" text-anchor="middle" opacity="1">RISING</text>
  <rect x="566" y="92" width="176" height="244" fill="#3a341d" opacity="0.55"/>
  <text x="654.0" y="112" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#98a2c0" text-anchor="middle" opacity="1">PLATEAU</text>
  <rect x="742" y="92" width="162" height="244" fill="#3a1f2a" opacity="0.55"/>
  <text x="823.0" y="112" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#98a2c0" text-anchor="middle" opacity="1">DECLINE</text>
  <line x1="78" y1="336" x2="904" y2="336" stroke="#2b3149" stroke-width="1.5"/>
  <line x1="78" y1="92" x2="78" y2="336" stroke="#2b3149" stroke-width="1.5"/>
  <text x="64" y="214.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#98a2c0" text-anchor="middle" opacity="1" transform="rotate(-90 64 214.0)">signal strength</text>
  <text x="491.0" y="362" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#98a2c0" text-anchor="middle" opacity="1">time  →</text>
  <path d="M 78 328 C 190 326, 252 282, 358 240 C 452 202, 508 186, 574 176 C 660 164, 730 158, 796 150 C 840 144, 872 150, 900 166" fill="none" stroke="#6366f1" stroke-width="4" stroke-linecap="round"/>
  <line x1="358" y1="240" x2="358" y2="336" stroke="#22c55e" stroke-width="1.4" stroke-dasharray="4 5" opacity="0.6"/>
  <circle cx="358" cy="240" r="10" fill="#22c55e" stroke="#151824" stroke-width="2"/>
  <text x="358" y="244" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" fill="#151824" text-anchor="middle" opacity="1">1</text>
  <line x1="520" y1="188" x2="520" y2="336" stroke="#eab308" stroke-width="1.4" stroke-dasharray="4 5" opacity="0.6"/>
  <circle cx="520" cy="188" r="10" fill="#eab308" stroke="#151824" stroke-width="2"/>
  <text x="520" y="192" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" fill="#151824" text-anchor="middle" opacity="1">2</text>
  <line x1="620" y1="170" x2="620" y2="336" stroke="#f7768e" stroke-width="1.4" stroke-dasharray="4 5" opacity="0.6"/>
  <circle cx="620" cy="170" r="10" fill="#f7768e" stroke="#151824" stroke-width="2"/>
  <text x="620" y="174" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" fill="#151824" text-anchor="middle" opacity="1">3</text>
  <line x1="806" y1="148" x2="806" y2="336" stroke="#f7768e" stroke-width="1.4" stroke-dasharray="4 5" opacity="0.6"/>
  <circle cx="806" cy="148" r="10" fill="#f7768e" stroke="#151824" stroke-width="2"/>
  <text x="806" y="152" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" fill="#151824" text-anchor="middle" opacity="1">4</text>
  <rect x="44" y="383" width="10" height="10" rx="2" fill="#22c55e"/>
  <text x="62" y="392" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#e6e9f2" text-anchor="start" opacity="1"><tspan fill="#98a2c0" font-weight="700">1  </tspan><tspan fill="#22c55e" font-weight="700">COMMIT</tspan><tspan fill="#98a2c0" font-weight="400">  ·  novel + real use + robust core</tspan></text>
  <rect x="44" y="415" width="10" height="10" rx="2" fill="#eab308"/>
  <text x="62" y="424" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#e6e9f2" text-anchor="start" opacity="1"><tspan fill="#98a2c0" font-weight="700">2  </tspan><tspan fill="#eab308" font-weight="700">GUARD</tspan><tspan fill="#98a2c0" font-weight="400">  ·  the trend-riding layer may not survive</tspan></text>
  <rect x="486" y="383" width="10" height="10" rx="2" fill="#f7768e"/>
  <text x="504" y="392" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#e6e9f2" text-anchor="start" opacity="1"><tspan fill="#98a2c0" font-weight="700">3  </tspan><tspan fill="#f7768e" font-weight="700">DON’T START</tspan><tspan fill="#98a2c0" font-weight="400">  ·  a 2-year project lands after the peak</tspan></text>
  <rect x="486" y="415" width="10" height="10" rx="2" fill="#f7768e"/>
  <text x="504" y="424" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#e6e9f2" text-anchor="start" opacity="1"><tspan fill="#98a2c0" font-weight="700">4  </tspan><tspan fill="#f7768e" font-weight="700">STOP / REFRAME</tspan><tspan fill="#98a2c0" font-weight="400">  ·  keep the robust core, drop the rider</tspan></text>
  <text x="32" y="464" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#98a2c0" text-anchor="start" opacity="1">Conceptual model, not measured data. Phase boundaries are judgement calls; re-run the gate every 3–6 months.</text>

</svg>
