name: Bio-Inspired Autonomous Audit

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_target:
    types: [opened, synchronize]

concurrency:
  group: bio-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  checks: write
  contents: write
  issues: write
  packages: read
  pull-requests: write
  security-events: write
  statuses: write

jobs:
  # ---- Code Audit: runs on trusted PR/push, never on pull_request_target ----
  code_audit:
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3

  # ---- Dependency review: read-only token + PR comment ----
  dependency_review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  # ---- Jataka → Soul -> Sahaja -> Dunce autonomous gate ----
  bio_audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Kill Switch Check
        id: killswitch
        run: |
          if [ -f .bio/automation_lock.json ]; then
            echo "locked=true" >> "$GITHUB_OUTPUT"
          else
            echo "locked=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Jataka Precedent Query + Priority
        id: jataka
        if: steps.killswitch.outputs.locked == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/jataka_query.py

      - name: Soul Drift Check
        id: soul
        if: steps.killswitch.outputs.locked == 'false'
        run: python scripts/soul_check.py

      - name: Sahaja Effort Budget
        id: sahaja
        if: steps.killswitch.outputs.locked == 'false'
        run: python scripts/sahaja_budget.py

      - name: Dunce Consensus Gate
        id: dunce
        if: steps.killswitch.outputs.locked == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/dunce_gate.py

      - name: Autonomous Merge
        if: steps.dunce.outputs.verdict == 'pass' && steps.jataka.outputs.priority != 'P0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge --auto --squash "${{ github.event.pull_request.number }}"

      - name: Quarantine
        if: steps.dunce.outputs.verdict == 'fail'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/dunce_quarantine.py

      - name: Lessons-Learned
        if: always()
        run: python scripts/dunce_postmortem.py
