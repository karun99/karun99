name: TRL Tracker

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: trl-tracker
  cancel-in-progress: true

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run TRL tracker
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/trl/trl_tracker.py

      - name: Commit auto-updates
        run: |
          git add README.md
          if git diff --cached --quiet; then
            echo "No TRL changes — skipping commit."
          else
            git -c user.name="trl-bot" -c user.email="actions@users.noreply.github.com" \
              commit -m "chore: auto-update TRL status [skip ci]"
            git push
          fi