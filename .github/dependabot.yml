version: 2

# Bio-Inspired Autonomous Audit — Dependabot source config
# Sole ecosystem: this repository ships no package manifests, so Dependabot
# monitors GitHub Actions. See BIO_AUDIT.md §12 for the reference template
# (swap package-ecosystem to "npm"/"pip"/... per stack).
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5
    # prio/P2 is the seed; scripts/jataka_query.py upgrades it to prio/P0-P3.
    labels: ["dependencies", "security", "prio/P2"]
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(dev-deps)"
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
